name: Setup
description: Install Node from .nvmrc, enable Yarn through Corepack and install the dependencies.

runs:
  using: composite
  steps:
    # Corepack must be on before setup-node, which runs `yarn` to find the cache folder.
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
