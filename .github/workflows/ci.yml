name: CI

on:
  pull_request:
    branches: [main, develop]
  # Two pull requests can each pass against an older develop and still break it
  # once both are merged; the push run is what catches that.
  push:
    branches: [main, develop]

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. A run on main or
# develop gets a group of its own commit and is never cancelled: sharing one
# group per branch would still let GitHub drop a queued run when a newer one
# arrives, leaving that merge without a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One job per check, so a failure names what broke. The job names are the
# required status checks of main and develop; renaming one breaks that rule.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn lint

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn format:check

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: yarn build
        env:
          # The build never calls the API; next.config.ts only reads the host
          # to allow its images, so any valid URL will do.
          API_URL: http://localhost:8080
